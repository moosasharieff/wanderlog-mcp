# Branch Guard
#
# Enforces the repo's branch model: feature branch -> dev -> main.
# Any pull request targeting `main` must have `dev` as its source branch, so nothing
# reaches PROD without first landing on `dev` and being verified there.
#
# Pure GitHub metadata check - no build, no deploy, no external calls.

name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  require-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "PRs into main must come from the 'dev' branch (got '$HEAD_REF')."
            echo "Merge your feature branch into dev first, then open a dev -> main promotion PR."
            exit 1
          fi
